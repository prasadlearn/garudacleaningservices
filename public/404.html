<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Garuda Cleaning Services</title>
    <script>
      // Single Page Apps redirect fallback for static hosts
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace('/' + (path.startsWith('/') ? path.slice(1) : path) + search + hash);
    </script>
  </head>
  <body>
    <p>Redirecting to Garuda Cleaning Services...</p>
  </body>
</html>
